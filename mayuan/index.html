<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>马克思主义基本原理 题库练习</title>
<style>
:root{
  --bg:#f4f6f8; --fg:#1c2430; --muted:#66707e; --card:#ffffff; --line:#dfe4ea;
  --primary:#b3342c; --primary-fg:#ffffff; --ok:#1a7f45; --ok-bg:#e6f5ec;
  --bad:#c02b2b; --bad-bg:#fdeaea; --accent:#fbf0ef;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14181d; --fg:#e8ecf1; --muted:#98a2b0; --card:#1d232a; --line:#2c343d;
    --primary:#e06a5f; --primary-fg:#160b0a; --ok:#6fd39b; --ok-bg:#17301f;
    --bad:#f08b8b; --bad-bg:#3a1e1e; --accent:#2a2224;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:22px 18px 56px}
header.app{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:600}
.meta{color:var(--muted);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 18px}
.bar>i{display:block;height:100%;width:0;background:var(--primary);border-radius:99px;transition:width .2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px}
.qhead{display:flex;gap:10px;align-items:baseline;color:var(--muted);font-size:14px;margin-bottom:10px;flex-wrap:wrap}
.tag{border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:12.5px}
.stem{font-size:17.5px;line-height:1.8;margin:0 0 18px;white-space:pre-wrap}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;font:inherit;transition:background .12s,border-color .12s}
.opt:hover:not(:disabled){background:var(--accent)}
.opt:disabled{cursor:default}
.opt .k{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;font-size:14px;font-weight:600}
.opt .t{flex:1 1 auto}
.opt.sel{border-color:var(--primary);background:var(--accent)}
.opt.sel .k{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.6}
.fb{margin-top:16px;display:none;align-items:flex-start;gap:12px;font-size:16px}
.fb.show{display:flex}
.fb .badge{flex:0 0 auto;border-radius:8px;padding:3px 11px;font-weight:600;font-size:15px}
.fb.good .badge{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.fb.bad .badge{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.next{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;
  padding:9px 16px;font:inherit;cursor:pointer}
.btn:hover{background:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.hint{color:var(--muted);font-size:13.5px}
.group{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:12px}
.start h2{font-size:17px;margin:0 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg);
  border-radius:99px;padding:6px 13px;font:inherit;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.result h2{font-size:20px;margin:2px 0 10px}
.score{font-size:44px;font-weight:600;line-height:1.1;margin:6px 0 4px}
.wrongs{margin-top:18px;display:grid;gap:10px}
.wrong{border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.wrong .q{font-size:15px}
.wrong .a{color:var(--ok);font-size:15px;margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.hidden{display:none}
footer{margin-top:22px;color:var(--muted);font-size:13px}
@media (max-width:560px){
  .wrap{padding:16px 14px 40px}
  h1{font-size:17px;line-height:1.4}
  .card{padding:18px 15px 16px;border-radius:12px}
  .stem{font-size:17px;margin-bottom:14px}
  .opt{padding:13px 13px}
  .next .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
  .next .row .btn{width:100%;padding:11px 10px}
  .next .row #nextBtn{grid-column:1 / -1}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <h1>马克思主义基本原理 · 题库练习</h1>
    <div class="meta" id="counter"></div>
  </header>
  <div class="bar" id="bar" role="progressbar" aria-label="答题进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>

  <section class="card start" id="start">
    <h2>开始练习</h2>
    <div class="hint" id="intro"></div>
    <div class="group" style="margin-top:14px">
      <div class="hint">章节</div>
      <div class="chips" id="chapterChips" role="group" aria-label="章节"></div>
    </div>
    <div class="group">
      <div class="hint">题型</div>
      <div class="chips" id="typeChips" role="group" aria-label="题型">
        <button class="chip" type="button" data-type="all" aria-pressed="true">全部题型</button>
        <button class="chip" type="button" data-type="single" aria-pressed="false">单项选择</button>
        <button class="chip" type="button" data-type="multi" aria-pressed="false">多项选择</button>
        <button class="chip" type="button" data-type="judge" aria-pressed="false">判断题</button>
      </div>
    </div>
    <div class="group">
      <div class="hint">顺序</div>
      <div class="chips" id="orderChips" role="group" aria-label="顺序">
        <button class="chip" type="button" data-order="seq" aria-pressed="true">按原顺序</button>
        <button class="chip" type="button" data-order="rand" aria-pressed="false">随机顺序</button>
      </div>
    </div>
    <div class="row">
      <button class="btn primary" id="startBtn" type="button">开始答题</button>
      <span class="hint">多选需选好后点“提交答案”</span>
    </div>
  </section>

  <section class="card hidden" id="quiz">
    <div class="qhead">
      <span class="tag" id="qtag">单项选择</span>
      <span id="qno"></span>
      <span id="stats" style="margin-left:auto"></span>
      <button class="btn" id="exitBtn" type="button" style="padding:3px 10px;font-size:13px">返回设置</button>
    </div>
    <p class="stem" id="stem"></p>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" role="status" aria-live="polite">
      <span class="badge" id="fbBadge"></span>
      <span class="txt" id="fbText"></span>
    </div>
    <div class="next">
      <span class="hint" id="autoHint"></span>
      <span class="row" style="margin-top:0">
        <button class="btn" id="prevBtn" type="button">上一题</button>
        <button class="btn" id="autoBtn" type="button">暂停自动跳转</button>
        <button class="btn primary" id="nextBtn" type="button">下一题</button>
      </span>
    </div>
  </section>

  <section class="card hidden result" id="result">
    <h2>练习完成</h2>
    <div class="score" id="scoreText"></div>
    <div class="hint" id="scoreSub"></div>
    <div class="row">
      <button class="btn primary" id="againBtn" type="button">再来一遍</button>
      <button class="btn" id="wrongBtn" type="button">只练错题</button>
      <button class="btn" id="homeBtn" type="button">返回设置</button>
    </div>
    <div class="wrongs" id="wrongs"></div>
  </section>

  <footer>题目与答案取自《马克思主义基本原理》导论及第一至七章习题（共 1104 题）。</footer>
</div>

们采取了一系列治理措施，取得了明显效果。从尊重客观规律与发挥主观能动性的角度看( )","options":[{"k":"A","t":"赤潮不能消灭但能有效扼制"},{"k":"B","t":"赤潮治理必须尊重客观规律"},{"k":"C","t":"人类总有一天能够消灭赤潮"},{"k":"D","t":"赤潮不能消灭也不能扼制"}],"answer":"AB","id":"第一章-293","index":293},{"chapter":"第一章","goal":"能力目标","type":"multi","no":29,"stem":"“100-1=0”被一些管理学家奉为定律，意在提醒人们防止因1%的错误导致100%的失败。“100-1=0”蕴含的哲理是( )","options":[{"k":"A","t":"部分决定整体，整体的性质决定于部分的性质"},{"k":"B","t":"整体决定部分，部分的作用取决于其在整体中的地位"},{"k":"C","t":"整体与部分相互制约，关键部分的功能关系整体的成败"},{"k":"D","t":"整体与部分相互联系，部分的作用有时大于整体的作用"}],"answer":"BCD","id":"第一章-294","index":294},{"chapter":"第一章","goal":"能力目标","type":"multi","no":30,"stem":"长期以来，农业生产中施肥浇水凭经验和感觉。某教授对传统经验进行系统分析，去伪存真、总结概括，研究、开发出“基于模型的精确作物管理技术”，指导农民定时定量科学种田，取得了少施氮肥、增产增收的显著成效。定时定量科学种田取得显著成效，说明( )","options":[{"k":"A","t":"量的积累必然推动事物的发展"},{"k":"B","t":"量的积累不一定引起质的变化"},{"k":"C","t":"适度量变才能推动事物发展"},{"k":"D","t":"量变和质变辩证统一的"}],"answer":"CD","id":"第一章-295","index":295},{"chapter":"第一章","goal":"能力目标","type":"multi","no":31,"stem":"GDP是衡量一个国家或地区经济规模、综合国力和国民收入水平的重要指标。它是分析和判断宏观经济运行状况、正确实施宏观调控政策的重要依据，但是它的局限性在于难以反映经济与社会发展的协调性。这反映了( )","options":[{"k":"A","t":"矛盾有主要和次要方面"},{"k":"B","t":"事物都是一分为二的"},{"k":"C","t":"矛盾有主要和次要之分"},{"k":"D","t":"事物都是表里如一的"}],"answer":"AB","id":"第一章-296","index":296},{"chapter":"第一章","goal":"能力目标","type":"multi","no":32,"stem":"人类在太空活动中发展起来的技术可以为人类造福，但太空活动留下的大量航空器残髓等太空垃圾却可能给人类带来巨大的危害。这个事实印证了一个古老的哲学命题：“福兮，祸之所伏”。这个命题表明( )","options":[{"k":"A","t":"矛盾双方逐渐融合趋向一个无差别的统一体"},{"k":"B","t":"矛盾双方相互对立、相互分离的趋势"},{"k":"C","t":"矛盾双方相互贯通，在一定条件下相互转化"},{"k":"D","t":"矛盾双方相互依赖，共处于一个统一体中"}],"answer":"CD","id":"第一章-297","index":297},{"chapter":"第一章","goal":"能力目标","type":"multi","no":33,"stem":"2009年是达尔文诞辰200周年，他发表于1859年的《物种起源》至今深刻影响着人们对生命起源和进化历程的认识，尽管人们对其进化假说一直存在争议，但他的基本观点还是闪烁着真理的光彩，不断被科学的发展所证实，例如( )","options":[{"k":"A","t":"生物是自然长期发展的产物，不是神的意志的产物"},{"k":"B","t":"生物进化的自然选择说揭示了生物进化的根本内因"},{"k":"C","t":"人类的起源是生物进化的结果，否定了上帝造人说"},{"k":"D","t":"劳动在从古猿到人的转化过程中起了决定性的作用"}],"answer":"AC","id":"第一章-298","index":298},{"chapter":"第一章","goal":"能力目标","type":"multi","no":34,"stem":"哲学基本问题主要包括两方面内容（ ）","options":[{"k":"A","t":"思维和存在何者为第一性的问题"},{"k":"B","t":"世界是如何发展的问题"},{"k":"C","t":"思维和存在是否具有同一性的问题"},{"k":"D","t":"世界的本质是一个还是多个的问题"}],"answer":"AC","id":"第一章-299","index":299},{"chapter":"第一章","goal":"能力目标","type":"multi","no":35,"stem":"哲学的物质范畴是（ ）","options":[{"k":"A","t":"感性地存在着的东西"},{"k":"B","t":"科学发展到一定程度所认识到某层次的物质形态"},{"k":"C","t":"从具有无限多样的结构、特性的具体形态总和中抽象出来的"},{"k":"D","t":"各种具体事物中抽象概括出的普遍科学概念"}],"answer":"CD","id":"第一章-300","index":300},{"chapter":"第一章","goal":"能力目标","type":"multi","no":36,"stem":"意识是（ ）","options":[{"k":"A","t":"人脑的分泌物"},{"k":"B","t":"人脑的属性和机能"},{"k":"C","t":"神的启示"},{"k":"D","t":"客观存在的主观映像"}],"answer":"BD","id":"第一章-301","index":301},{"chapter":"第一章","goal":"能力目标","type":"multi","no":37,"stem":"马克思主义认为，社会的存在与发展不同于自然界，社会活动是有意识的活动。但从本质上看，社会的存在与发展是客观的。这是因为（ ）","options":[{"k":"A","t":"自然界的存在与发展是客观的"},{"k":"B","t":"人的意志不能影响和决定社会的发展"},{"k":"C","t":"人类社会是物质世界长期发展的产物"},{"k":"D","t":"构成社会生活条件的基本要素是客观的"}],"answer":"CD","id":"第一章-302","index":302},{"chapter":"第一章","goal":"能力目标","type":"multi","no":38,"stem":"植物体细胞杂交技术不断发展，通过细胞融合获得的杂交植物已有不少。不久的将来，许多自然界中没有的新型植物将会呈现在我们面前，令我们大开眼界。生物工程中取得这些成果的哲学意义有（ ）","options":[{"k":"A","t":"说明人们能够创造物质"},{"k":"B","t":"人类只能听任自然的摆布，必须服从自然"},{"k":"C","t":"进一步证明了世界的本质是物质"},{"k":"D","t":"有力地驳斥了“上帝创世论”"}],"answer":"CD","id":"第一章-303","index":303},{"chapter":"第一章","goal":"能力目标","type":"multi","no":39,"stem":"欧洲科学家发现了一种可以在太空真空环境中生存的动物--缓步类，也被称作水熊。不仅仅是在太空，它们中的一部分还可以同时在真空和太阳辐射条件下生存，这是人类当时发现的唯一一种可以在双重严酷条件下存活的动物。这说明（ ）","options":[{"k":"A","t":"自然界中的事物是按照自身所固有的规律形成和发展的"},{"k":"B","t":"生物是神创造的"},{"k":"C","t":"任何生物都有自已存在和发展的条件"},{"k":"D","t":"人类社会在本质上是一个客观的物质体系"}],"answer":"AC","id":"第一章-304","index":304},{"chapter":"第一章","goal":"能力目标","type":"multi","no":40,"stem":"科学家们在通过集齐观测数据并深度分析后，让黑洞终于有了一张张“正面照”。这张照片证实了神秘黑洞天体的存在，使得爱因斯的百年猜想终得检验。这表明:（ ）","options":[{"k":"A","t":"黑洞是统一的物质世界的一部分"},{"k":"B","t":"科学研究是检验认识正确与否的唯一标准"},{"k":"C","t":"世界上只有尚未认识之物，没有不可认识之物"},{"k":"D","t":"在意识指导下，人们能够能动地改造世界"}],"answer":"AC","id":"第一章-305","index":305},{"chapter":"第一章","goal":"能力目标","type":"multi","no":41,"stem":"高一年级某班开展以“你心目中的小康生活”为议题开展探究性学习。全班同学聆听身边的百姓声音，记录城乡巨变。下面是部分同学调查搜集的资料 ◇某县茶庄农户李青年：一亩油茶百斤油，有娶媳妇有盖楼。 ◇河南退休干部彭先生：有吃有穿，平平安安。 ◇十八洞村返乡大学生施林娇：直播带货买特产，为家乡做点小贡献。 ◇平原池村党总支书刘明：自然环境改善了，传统文化守住了。 ◇南通朗山风景名胜区管委会副主任邵文建：看着碧水蓝天，就是我心中的小康 对小康生活不同的回答表明（ ）","options":[{"k":"A","t":"不同的生活与实践影响人的认识"},{"k":"B","t":"人的意识是大脑的机能"},{"k":"C","t":"不同的意识都是对客观存在的反映"},{"k":"D","t":"人的意识是社会发展的产物"}],"answer":"AC","id":"第一章-306","index":306},{"chapter":"第一章","goal":"能力目标","type":"multi","no":42,"stem":"位于全球各地的“事件视界望远镜”(EHT)拍摄到的首张黑洞图像将于当日新鲜“出炉”。黑洞，这个恍若鬼魅的天体又开始霸道地侵袭我们的视野。这张在全球多地同步公布的“大片”，证实了神秘天体黑洞的存在，也使得爱因斯坦的百年猜想终得检验!也将帮助回答星系中的壮观喷流如何产生并影响星系演化等诸多前沿问题。这表明","options":[{"k":"A","t":"黑洞是统一的物质世界的一部分"},{"k":"B","t":"黑洞是世界的本原"},{"k":"C","t":"思维和存在具有同一性"},{"k":"D","t":"人类完全揭开了黑洞的面纱"}],"answer":"AC","id":"第一章-307","index":307},{"chapter":"第一章","goal":"能力目标","type":"multi","no":43,"stem":"现象和本质的统一表现在（ ）","options":[{"k":"A","t":"任何现象都从一定的方面表现着本质"},{"k":"B","t":"任何本质都通过一定的现象表现出来"},{"k":"C","t":"本质决定现象，现象也决定本质"},{"k":"D","t":"假象也是对本质歪曲的颠倒的表现"}],"answer":"ABD","id":"第一章-308","index":308},{"chapter":"第一章","goal":"能力目标","type":"multi","no":44,"stem":"下列观点涉及对哲学的基本问题的讨论的是","options":[{"k":"A","t":"“天地之变，阴阳之化”与“存在就是被感知”"},{"k":"B","t":"“子非鱼，安知鱼之乐”与“人类认识是无限发展的”"},{"k":"C","t":"“人有多大胆，地有多高产”与“胜败天注定”"},{"k":"D","t":"“巧妇能为无米之炊”与“画饼充饥”"}],"answer":"AB","id":"第一章-309","index":309},{"chapter":"第一章","goal":"能力目标","type":"multi","no":45,"stem":"哲学的基本问题是一切哲学都不能回避、必须回答的问题。下列各选项中，体现围绕哲学基本问题而产生的对立的是","options":[{"k":"A","t":"“道生一、一生二、二生三，三生万物”与“存在即被感知”"},{"k":"B","t":"“世界是一团永恒燃烧的活火”与“知是行之始，行是知之成”"},{"k":"C","t":"“天地合而万物生，阴阳接而变化起”与“理在事先，理生万物”"},{"k":"D","t":"“子非鱼，安知鱼之乐”与“世界上只有尚未认识之物，而无不可认识之物”"}],"answer":"CD","id":"第一章-310","index":310},{"chapter":"第一章","goal":"能力目标","type":"multi","no":46,"stem":"“僚鱼游从容，是鱼之乐也。”与“子非鱼，安知鱼之乐？”是两种根本不同的观点。下列关于两者之间关系说法正确的有","options":[{"k":"A","t":"两者的分歧主要受客体变化的复杂性制约"},{"k":"B","t":"两者存在的分歧表明人的认识具有主体差异性"},{"k":"C","t":"两者观点是划分唯物主义与唯心主义的标准"},{"k":"D","t":"两者根本分歧在于思维与存在有无同一性问题 A.AB B．AC C．BD D．CD"}],"answer":"BD","id":"第一章-311","index":311},{"chapter":"第一章","goal":"能力目标","type":"multi","no":47,"stem":"在2019软件定义卫星高峰论坛上，中国科学院院士“嫦娥之父”欧阳自远介绍，中国将于2020年探测火星，通过火星卫星、火星着陆器、火星车天地联合探测火星生命信息，研究宇宙和天体环境科学以及探讨改造和建立人类第二个栖息地的前景。由此可知","options":[{"k":"A","t":"思维是对存在的正确反映"},{"k":"B","t":"思维能够正确反映存在"},{"k":"C","t":"思维和存在是相互依赖的"},{"k":"D","t":"思维和存在具有同一性"}],"answer":"BD","id":"第一章-312","index":312},{"chapter":"第一章","goal":"能力目标","type":"multi","no":48,"stem":"古希腊哲学是朴素的，尚未注意到思维与存在的对立统一。巴门尼德第一次提出了“思维与存在是同一的”命题，但没有把思维与存在区分开来。柏拉图的“理念论”“本体论”等观点把理念世界和感性世界对立起来，在一定意义上分离了思维与存在。研究哲学基本问题的意义在于","options":[{"k":"A","t":"帮助我们更好地认识世界和改造世界"},{"k":"B","t":"提供了划分可知论和不可知论的标准"},{"k":"C","t":"提供了划分主观唯心和客观唯心的标准"},{"k":"D","t":"这是一切哲学都不能回避、必须回答的问题"}],"answer":"AB","id":"第一章-313","index":313},{"chapter":"第一章","goal":"能力目标","type":"multi","no":49,"stem":"中医用金、木、水、火、土分别对应肺、肝、肾、心、脾等人体五脏，认为人体是一个以心为主宰、以五脏为中心的统一体，通过经络相互连结，相生相克而相互调节，维持整体协调和平衡。中医思想的合理性在于","options":[{"k":"A","t":"坚持了唯物主义的根本方向"},{"k":"B","t":"对思维与存在的关系问题做出了科学回答"},{"k":"C","t":"体现了朴素的辩证法思想"},{"k":"D","t":"总结近代自然科学成就，丰富了唯物主义"}],"answer":"AC","id":"第一章-314","index":314},{"chapter":"第一章","goal":"能力目标","type":"multi","no":50,"stem":"2020年高考，某学校送考车队中，以车牌含数字“985”的车辆开道、以车牌含数字“211”的车辆压阵。下列选项与此现象不属于同一哲学派别的是","options":[{"k":"A","t":"据器而道存，离器而道毁"},{"k":"B","t":"吾心便是宇宙，宇宙便是吾心"},{"k":"C","t":"子不语怪力乱神"},{"k":"D","t":"眼开则花在，眼闭则花谢"}],"answer":"AC","id":"第一章-315","index":315},{"chapter":"第一章","goal":"能力目标","type":"multi","no":51,"stem":"哲学的基本问题是一切哲学都不能回避、必须回答的问题。下列各选项中，体现围绕哲学基本问题而产生的哲学基本派别对立的是","options":[{"k":"A","t":"“气者，理之依也”与“人病则忧惧，忧惧则鬼出”"},{"k":"B","t":"“豪华尽出成功后，逸乐安知与祸双”与“天不变，道亦不变”"},{"k":"C","t":"“世界是一团永恒燃烧的活火”与“宇宙便是吾心，吾心便是宇宙”"},{"k":"D","t":"“天地合而万物生，阴阳接而变化起”与“道生一，一生二，二生三，三生万物”"}],"answer":"CD","id":"第一章-316","index":316},{"chapter":"第一章","goal":"能力目标","type":"multi","no":52,"stem":"“城市发展是一个自然历史过程，城市发展和经济发展两者相辅相成、相互促进。城市发展是农村人口向城市集聚、农业用地按相应规模转化为城市建设用地的过程，人口和用地要匹配，城市规模要同资源环境承载能力相适应。”这蕴含的哲学道理是","options":[{"k":"A","t":"自然界中各事物都是统一的物质世界中的一部分"},{"k":"B","t":"要利用自然首先必须认识自然、改造自然"},{"k":"C","t":"人类社会在本质上是一个客观的物质体系"},{"k":"D","t":"人类意识是物质世界长期发展的产物"}],"answer":"AC","id":"第一章-317","index":317},{"chapter":"第一章","goal":"能力目标","type":"multi","no":53,"stem":"最新研究显示，当我们压力大时就喜欢吃辣味食物，这是因为辣椒中的辣椒素能刺激口腔神经末梢，大脑便释放出可以使人偷快的物质----内啡肽。香蕉中富含的镁元素，可以缓解紧张情绪。这些研究（ ）","options":[{"k":"A","t":"是在承认物质决定意识的前提下进行的"},{"k":"B","t":"从侧面证明人脑是意识活动的生理基础"},{"k":"C","t":"说明没有反映对象就不会有意识的产生"},{"k":"D","t":"表明运动是物质的根本属性和存在方式"}],"answer":"AB","id":"第一章-318","index":318},{"chapter":"第一章","goal":"能力目标","type":"multi","no":54,"stem":"沈阳市要继续打好蓝天保卫战，加大生态环境保护治理力度，有效应对重污染天气。加强对雾霾形成机理的研究，提高应对的科学性和精准性。这是基于","options":[{"k":"A","t":"人能根据规律发生作用的条件和形式利用规律"},{"k":"B","t":"发挥主观能动性能够改造客观世界的客观规律"},{"k":"C","t":"尊重客观规律是实践活动取得成功的前提条件"},{"k":"D","t":"人的主观世界影响人们对客观存在事物的反映"}],"answer":"AC","id":"第一章-319","index":319},{"chapter":"第一章","goal":"能力目标","type":"multi","no":55,"stem":"神话分为三类：创世神话、神佛神话、英雄神话。在各国的创世神话中，几乎都是神（上帝）从混沌中开创大地山河。这种由神（上帝）开创大地山河的思想","options":[{"k":"A","t":"源于客观存在，但在基本方向上是错误的"},{"k":"B","t":"源于远古人类的头脑，是一.种大胆的猜想"},{"k":"C","t":"属于唯心主义观点，认为思维决定存在"},{"k":"D","t":"具有形而上学性和机械性，没有科学依据"}],"answer":"AC","id":"第一章-320","index":320},{"chapter":"第一章","goal":"能力目标","type":"multi","no":56,"stem":"如果地震预警时间为3秒，可使伤亡率减少14%；如果预警时间为10秒和60秒，可使人员伤亡减少39%和95%．在2019年6月17日22点55分发生的四川宜宾长宁县6.0级地震中，四川长宁地震预警网提前10秒向宜宾预警，提前61秒向成都预警，为震区群众赢得了宝贵的时间。这说明（ ）","options":[{"k":"A","t":"正确发挥主观能动性能避免地震灾害的发生"},{"k":"B","t":"意识的能动创造性能够精准预测地壳的运动变化"},{"k":"C","t":"地理气候变化虽然复杂但一定有内在规律"},{"k":"D","t":"预警系统的完善能够为地震预警提供条件"}],"answer":"CD","id":"第一章-321","index":321},{"chapter":"第一章","goal":"能力目标","type":"multi","no":57,"stem":"古希腊哲学家赫拉克利特曾经说过“人不能两次踏进同一条河流”，而他的学生克拉底鲁则认为“人一次也不能踏进同一条河流”。下列分析正确的是（ ）","options":[{"k":"A","t":"赫拉克利特强调运动变化，并没有否定相对静止"},{"k":"B","t":"赫拉克利特强调运动变化，同时否定了相对静止"},{"k":"C","t":"克拉底鲁夸大了绝对运动，否定了相对静止"},{"k":"D","t":"克拉底鲁认为运动是绝对的，静止是相对的"}],"answer":"AC","id":"第一章-322","index":322},{"chapter":"第一章","goal":"能力目标","t ","t":"运动和物质是不可分割的"},{"k":"C","t":"物质是运动的主体"},{"k":"D","t":"精神是运动的主体"}],"answer":"D","id":"第一章-448","index":448},{"chapter":"第一章","goal":"素质目标","type":"single","no":69,"stem":"20世纪50年代，北大荒一片荒凉。由于人口剧增，生产力水平低下，吃饭问题成为中国面临的首要问题，于是人们不得不靠扩大耕地面积增加粮食产量，经过半个世纪的开垦，北大荒成了全国闻名的“北大仓”。然而由于过度开垦已经造成了许多生态问题。现在，黑龙江垦区全面停止开荒，退耕还“荒”。这说明（ ）","options":[{"k":"A","t":"人与自然的和谐最终以恢复原始生态为归宿"},{"k":"B","t":"人们改造自然的一切行为都会遭到“自然界的报复”"},{"k":"C","t":"人们应合理地调节人与自然之间的物质变换"},{"k":"D","t":"人在自然界面前总是处于被支配的地位"}],"answer":"C","id":"第一章-449","index":449},{"chapter":"第一章","goal":"素质目标","type":"single","no":70,"stem":"鲁迅在评《三国演义》时说：“至于写人，亦颇有失，以致欲显刘备之长厚而似伪，状诸葛之多智而近妖”。这一评述所告诉我们的哲理是（ ）","options":[{"k":"A","t":"要区分事物的两重性"},{"k":"B","t":"要把握事物的度"},{"k":"C","t":"对事物既要肯定，又要否定"},{"k":"D","t":"要把事物看做一个整体"}],"answer":"B","id":"第一章-450","index":450},{"chapter":"第一章","goal":"素质目标","type":"multi","no":71,"stem":"某地乡村公路边有很多柿子园。金秋时节，农民采摘柿子时，最后总要在树上留一些熟透的柿子。农民们说，这是留约喜鹊的食物，每到冬天，喜鹊都在果树上筑巢过冬，到冬天也不飞走，整天忙着捕捉果树上的虫子，从而保证了来年柿子的丰收，从这个实例中，我们受到的启示是（ ）","options":[{"k":"A","t":"事物之间有其固有的客观联系"},{"k":"B","t":"人们可以发现并利用规律来实现自己的目的"},{"k":"C","t":"人与自然的关系是相互利用的关系"},{"k":"D","t":"保持生态的平衡是人类生存发展的必要条件"}],"answer":"ABD","id":"第一章-451","index":451},{"chapter":"第一章","goal":"素质目标","type":"single","no":72,"stem":"有一则箴言：“在溪水和岩石的斗争中，胜利的总是溪水，不是因为力量，而是因为坚持。”“坚持就是胜利”的哲理告诉我们成功在于（ ）","options":[{"k":"A","t":"必然性通过偶然性开辟道路"},{"k":"B","t":"肯定中包含着否定的因素"},{"k":"C","t":"量变必然引起质变"},{"k":"D","t":"有其因必有其果"}],"answer":"C","id":"第一章-452","index":452},{"chapter":"第一章","goal":"素质目标","type":"single","no":73,"stem":"在马克思主义普遍原理指导下，从中国的基本国情出发，走建设有中国特色社会主义道路。这体本现了（ ）","options":[{"k":"A","t":"矛盾的同一性和斗争性的统一"},{"k":"B","t":"矛盾的普遍性和特殊性的统一"},{"k":"C","t":"事物发展的量变和质变的统一"},{"k":"D","t":"事物发展的前进性和曲折性的统一"}],"answer":"B","id":"第一章-453","index":453},{"chapter":"第一章","goal":"素质目标","type":"single","no":74,"stem":"自信自立是习近平新时代中国特色社会主义思想的世界观和方法论的重要内容,是中国共产党人的重要精神气质。坚持自信自立,突出强调和体现的就是（ ）","options":[{"k":"A","t":"\"变\"与\"不变\"、继承与发展的辩证统一"},{"k":"B","t":"要把尊重客观规律和激发创新创造活力贯通起来"},{"k":"C","t": 能动性的充分发挥"},{"k":"D","t":"创造了新的经济发展模式与规律"}],"answer":"AB","id":"第一章-471","index":471},{"chapter":"第一章","goal":"素质目标","type":"multi","no":14,"stem":"2008年1月中下旬，我国南方10多个省区持续降雪，出现低温冰冻的极端天气现象，造成严重灾害，给人民生活、生产带来极大困难和损失。有专家指出，极端天气如果发生在远古或者发生在人烟稀少的地区，就不会构成如此严重的灾难。之所以造成如此严重灾害，和时值“春运”、发生在人口稠密、经济发展较快地区以及防灾准备不足等因素共同起作用有密切关系。鉴于此，我国政府提出，越是经济发展越要高度重视防范灾害的工作。抗灾救难是重要的，但更重要的是居安思危，未雨绸缪，防患于未然。这个思想的哲学依据是，人能够发挥意识的能动作用( )","options":[{"k":"A","t":"认识自然规律，精确预见自然的未来变化"},{"k":"B","t":"认识人类行为和自然相互作用的可能后果"},{"k":"C","t":"采取适当的行动防止不利于自己的结果产生"},{"k":"D","t":"采取适当的行动改变自然规律和相关的条件"}],"answer":"BC","id":"第一章-472","index":472},{"chapter":"第一章","goal":"素质目标","type":"multi","no":15,"stem":"北京奥运会奖牌创造性地将象征尊贵和美德的“金”、“玉”材质组合在—起，实现了中国优秀文化与奥林匹克精神的完美结合。这一设计与创新说明 ( )","options":[{"k":"A","t":"意识活动具有主动创造性和自觉选择性"},{"k":"B","t":"创新必须坚持辩证的思维方法"},{"k":"C","t":"系统优化的方法要求我们用综合的思维方式认识事物"},{"k":"D","t":"认识是主体对客体的直接现实性改造"}],"answer":"ABC","id":"第一章-473","index":473},{"chapter":"第一章","goal":"素质目标","type":"multi","no":16,"stem":"2008年1月中下旬，我国南方10多个省区持续降雪，出现低温冰冻的极端天气现象，造成严重灾害，给人民生活、生产带来极大困难和损失。有专家指出，极端天气如果发生在远古或者发生在人烟稀少的地区，就不会构成如此严重的灾难。之所以造成如此严重灾害，和时值“春运”、发生在人口稠密、经济发展较快地区以及防灾准备不足等因素共同起作用有密切关系。鉴于此，我国政府提出，越是经济发展越要高度重视防范灾害的工作。随着人类社会的发展，极端天气对人类生活的影响越来越大。这表明( )","options":[{"k":"A","t":"人类认识和改造自然的实践不断发展使人与自然的矛盾也随之深化和发展"},{"k":"B","t":"人类认识和改造自然的实践不断发展使人与自然的矛盾越来越激化和失控"},{"k":"C","t":"人类社会的发展使人类与自然界的联系越来越多样化和复杂化"},{"k":"D","t":"人类社会的发展越来越使人类超越自然而逐渐成为自然界的主宰"}],"answer":"AC","id":"第一章-474","index":474},{"chapter":"第一章","goal":"素质目标","type":"multi","no":17,"stem":"2008年1月中下旬，我国南方10多个省区持续降雪，出现低温冰冻的极端天气现象，造成严重灾害，给人民生活、生产带来极大困难和损失。有专家指出，极端天气如果发生在远古或者发生在人烟稀少的地区，就不会构成如此严重的灾难。之所以造成如此严重灾害，和时值“春运”、发生在人口稠密、经济发展较快地区以及防灾准备不足等因素共同起作用有密切关系。鉴于此，我国政府提出，越是经济发展越要高度重视防范灾害的工作。灾害一般是在各种不利因素同时出现时发生的，对人们生产、生活各方面产生直接或间接的不利影响。这使我们更深刻地认识到( )","options":[{"k":"A","t":"联系是普遍的，因此任何事物都可以是某一特定事件的原因或者结果"},{"k":"B","t":"联系是多样的，因此应该全面地认识与事件有关的各种联系"},{"k":"C","t":"联系是客观的，因此事件的发生与人的活动无关"},{"k":"D","t":"联系是有条件的，因此应该注意具体地分析事件发生的各种条件"}],"answer":"BD","id":"第一章-475","index":475},{"chapter":"第一章","goal":"素质目标","type":"multi","no":18,"stem":"“5.12”汶川大地震后，温家宝总理在看望北川中学高三学生时，用粉笔在黑板上写下了“多难兴邦”四个大字。“多难兴邦”一词蕴含的哲理是( )","options":[{"k":"A","t":"矛盾双方相互依赖"},{"k":"B","t":"事物的发展是量变和质变的统一"},{"k":"C","t":"矛盾双方相互贯通"},{"k":"D","t":"事物的发展是前进性和曲折性的统一"}],"answer":"CD","id":"第一章-476","index":476},{"chapter":"第一章","goal":"素质目标","type":"multi","no":19,"stem":"2009年3月28日20时30分到21时30分，全球24个时区的2000余座城镇以熄灯一小时的方式“接力”参加了世界自然基金会发起的旨在节能减排保护人类地球家园的“地球一小时”活动，我国从东到西众多城市的公众积极参与了这一活动，随着人类改造自然能力的不断增强，人类对地球家园造成的破坏性影响也越来越严重，人们通过“地球日”“地球一小时”等活动唤醒公众的环保意识，是因为( )","options":[{"k":"A","t":"环境的人为恶化有一个从逐渐量变到根本质变的演变过程"},{"k":"B","t":"环境的人为恶化是一个不可逆的从量变到质变的发展过程"},{"k":"C","t":"环境的改变是人类不断征服自然的从量变到质变的过程"},{"k":"D","t":"环境的改变是人与自然和谐相处的从量变到质变的过程"}],"answer":"AD","id":"第一章-477","index":477},{"chapter":"第一章","goal":"素质目标","type":"multi","no":20,"stem":"经过近10年艰苦实验，我国科学家应用基因技术，利用水稻亚种间遗传基因的杂交优势，培育出高产稳产的超级稻新品种。这说明( )","options":[{"k":"A","t":"外因和内因一起构成事物变化发展的根据"},{"k":"B","t":"在特定条件下外因构成事物发展变化的根据"},{"k":"C","t":"外因使事物的变化发展呈现出不同的特点"},{"k":"D","t":"外因通过改变内部矛盾双方的地位推动事物发展"}],"answer":"CD","id":"第一章-478","index":478},{"chapter":"第一章","goal":"素质目标","type":"multi","no":21,"stem":"中医、京剧是中华文化之瑰宝。中国传统医学有其独特的理论，在治疗一些疾病时遵循的医理是：治其外必治其内，治其内必治其根。下列表述与这一医理相一致的是（ ）","options":[{"k":"A","t":"现象表现本质，本质决定现象"},{"k":"B","t":"内因是事物变化的根据，内因决定外因"},{"k":"C","t":"主次矛盾在一定条件下互相转化"},{"k":"D","t":"主要矛盾在事物发展过程中处于支配地位"}],"answer":"AD","id":"第一章-479","index":479},{"chapter":"第一章","goal":"素质目标","type":"multi","no":22,"stem":"2021年是中国共产党百年华诞。百年征程波澜壮阔，百年初心历久弥坚。从上海石库门到嘉兴南湖，一艘小小红船承载着人民的重托、民族的希望，越过急流险滩，穿过惊涛骇浪，成为领航中国行稳致远的巍巍巨轮。下列诗句与上述材料蕴含的哲理相一致的是","options":[{"k":"A","t":"登山始觉天高广，到海方知浪渺茫"},{"k":"B","t":"历尽天华成此景，人间万事出艰辛"},{"k":"C","t":"问渠那得清如许？为有源头活水来"},{"k":"D","t":"沉舟侧畔千帆过，病树前头万木春"}],"answer":"BD","id":"第一章-480","index":480},{"chapter":"第一章","goal":"素质目标","type":"multi","no":23,"stem":"“高考的成功绝不是考场上的灵光乍现，而是源于平时艰难困厄练就的坚初顽强，厚积分秒之功，始得一鸣惊人，坚守不舍之气，方能赢得始终。----摘自某同学在高考百日誓师大会上的发言。高三学子从中的收获应有","options":[{"k":"A","t":"抓住机遇，保持事物性质的稳定"},{"k":"B","t":"坚定信心，发展的道路一片光明"},{"k":"C","t":"百折不挠，勇敢地面对各种考验"},{"k":"D","t":"注重积累，成功总是从量变开始"}],"answer":"CD","id":"第一章-481","index":481},{"chapter":"第一章","goal":"素质目标","type":"multi","no":24,"stem":"“谁知盘中餐，粒粒皆辛苦。”小餐桌，大文明，传承了中华民族尊重劳动、珍惜粮食、勤俭节约的传统美德。“成由俭起败由奢”，杜绝浪费应从幼时管起，从小事抓起，从家庭餐桌做起。下列与“成由俭起败由奢”哲学寓意相近的观点是","options":[{"k":"A","t":"不矜细行,终累大德"},{"k":"B","t":"道有夷险,履之者知"},{"k":"C","t":"积土为山,积水为海"},{"k":"D","t":"读万卷书,行万里路"}],"answer":"AC","id":"第一章-482","index":482},{"chapter":"第一章","goal":"素质目标","type":"multi","no":25,"stem":"习近平总书记曾在讲话中引用古语“禁微则易，救末者难”对作风方面存在问题的党员、干部进行教育提醒。下列与“禁微则易，救末者难”所蕴含哲理相似的是","options":[{"k":"A","t":"轻者重之端，小者大之源"},{"k":"B","t":"一着不慎，满盘皆输"},{"k":"C","t":"一叶知秋，见微知著"},{"k":"D","t":"凿井者起于三寸之坎，以就万仞之深"}],"answer":"AD","id":"第一章-483","index":483},{"chapter":"第一章","goal":"素质目标","type":"multi","no":26,"stem":"自然灾害给人类带来磨难，同时又促使人类更加自觉地去认识和把握自然规律、增强抵御自然灾害能力，进而推动人类文明进步。正如恩格斯所说，“没有哪一次巨大的历史灾难，不是以历史的进步为补偿的”。从灾难到进步，其中体现的深刻哲理是( )","options":[{"k":"A","t":"“灾难”和“进步”作为矛盾双方，包含着向对立面转化的趋势。"},{"k":"B","t":"“灾难”向“进步”转化是无条件的，体现了矛盾双方的互相贯通。"},{"k":"C","t":"“灾难”在一定条件下可以向“进步”转化，体现了矛盾的同一性。"},{"k":"D","t":"“灾难”促进“进步”在一定程度上体现了某些外因的决定作用。"}],"answer":"AC","id":"第一章-484","index":484},{"chapter":"第一章","goal":"素质目标","type":"multi","no":27,"stem":"经验告诉我们，手接触到火会感觉到烫，甚至被灼伤。《庄子·天下》中的辩者却提出了“火不热”命题。分析这一看上去荒谬的命题，可以使我们在一般与个别、主观与客观关系等问题上得到一些有益启示。下列说法中合理的是( )","options":[{"k":"A","t":"“一般的火”独立于“个别的火”，前者不热，后者热"},{"k":"B","t":"“一般的火”寓于“个别的火”之中，不能说“火不热”"},{"k":"C","t":"“热”的感觉由“火”引起，但不存在于“火”中，所以说“火不热”"},{"k":"D","t":"“热”与“不热”因人而异、没有标准，所以可说“火不热”"}],"answer":"BC","id":"第一章-485","index":485},{"chapter":"第一章","goal":"素质目标","type":"multi","no":28,"stem":"习近平总书记在决战决胜脱贫攻坚座谈会上强调，到2020年现行标准下的农村贫困人口全部脱贫，是党中央向全国人民作出的郑重承诺，必须如期实现。这是一场硬仗，越到最后越要紧绷这根弦，不能停顿、不能大意、不能放松。下列名句所含哲理与此相近的是","options":[{"k":"A","t":"欲穷千里目，更上一层楼"},{"k":"B","t":"行百里者半九十"},{"k":"C","t":"沉舟侧畔千帆过，病树前头万木春"},{"k":"D","t":"宜将剩勇追穷寇，不可沽名学霸王"}],"answer":"BD","id":"第一章-486","index":486},{"chapter":"第一章","goal":"素质目标","type":"multi","no":29,"stem":"马克思主义哲学同旧哲学相比较，它的科学性表现在（ ）","options":[{"k":"A","t":"科学地回答了世界的本质是什么的问题"},{"k":"B","t":"科学地回答了世界的状况是怎么样的问题"},{"k":"C","t":"正确地论证了世界的可知性问题"},{"k":"D","t":"在哲学史上第一次科学地提出了哲学基本问题"}],"answer":"ABCD","id":"第一章-487","index":487},{"chapter":"第一章","goal":"素质目标","type":"multi","no":30,"stem":"习近平总书记在多次重要讲话中引用老子《道德经》中的名言“图难于其易，为大于其细。天下难事，必作于易；天下大事，必作于细。”下列古语中与该名言所体现的哲理相一致的是","options":[{"k":"A","t":"宰相必起于州部，猛将必发于卒伍"},{"k":"B","t":"好事尽从难处得，少年无向易中轻"},{"k":"C","t":"天下之难持者莫如心，天下之易染者莫如欲"},{"k":"D","t":"大厦之成，非一木之材也；大海之阔，非一流之归也"}],"answer":"AD","id":"第一章-488","index":488},{"chapter":"第一章","goal":"素质目标","type":"multi","no":31,"stem":"当前社会上各种各样的诱惑缠绕着党员、干部，“温水煮青蛙”现象就会产生，一些人不知不觉就被人家请君入瓮了。这警示我们","options":[{"k":"A","t":"重视量的积累，能够促成事物发展"},{"k":"B","t":"对量变要做具体分析，做到防微杜渐"},{"k":"C","t":"打铁还须自身硬，要提高自身素质"},{"k":"D","t":"染墨则黑，外因是事物发展的内在根据"}],"answer":"BC","id":"第一章-489","index":489},{"chapter":"第一章","goal":"素质目标","type":"multi","no":32,"stem":"某地乡村公路边有很多柿子园。金秋时节农民采柿子时，最后总要在树上留一些熟透的柿子。果农们说，这是留给喜鹊的食物。每到冬天，喜鹊都在果树上筑巢过冬，到春天也不飞走，整天忙着捕捉果树上的虫子，从而保证了来年柿子的丰收。从这个事例中我们受到的启示是( )","options":[{"k":"A","t":"事物之间有其固有的客观联系"},{"k":"B","t":"人们可以发现并利用规律来实现自己的目的"},{"k":"C","t":"人与自然的关系是相互利用的关系"},{"k":"D","t":"保持生态系统的平衡是人类生存发展的必要条件"}],"answer":"ABD","id":"第一章-490","index":490},{"chapter":"第一章","goal":"素质目标","type":"multi","no":33,"stem":"头孢曲松纳是一种常见的抗生素，临床应用十分广泛。但是，如果把它和某些药物一起服用，就会导致药效减弱、副作用增强，对人体造成损害。这种现象在医学上称为配伍禁忌。在没有发现这个问题的时候，曾出现病人服用该药物致死的案例。卫生主管部门在调查研究的基础上，并没有禁止使用这种药物，而是要求在药品使用说明书中写明配伍禁忌的有关情况。药物的配伍禁忌问题启示我们( )","options":[{"k":"A","t":"应该在普遍联系中认识事物的性质和作用"},{"k":"B","t":"应该客观地认识事物在联系中的性质和作用"},{"k":"C","t":"应该摒弃那种控制条件研究事物的方法"},{"k":"D","t":"应该摒弃那种分门别类研究事物的方法"}],"answer":"AB","id":"第一章-491","index":491},{"chapter":"第一章","goal":"素质目标","type":"multi","no":34,"stem":"20年前，我们昂首阔步跨入小康社会。20年后，我们在中国共产党带领下一路披荆斩棘、顽强奋斗，创造了世界奇迹，实现了第一个百年奋斗目标即全面建成小康社会。这又是一个新起点，我们还要乘势而上，开启全面建设社会主义现代化国家新征程，向第二个百年奋斗目标进军。伟大梦想都是拼出来、干出来的，信守的理想不能灭，奋斗的脚步不能停。材料体现的哲学道理是","options":[{"k":"A","t":"事物的发展是通过量变实现的，是量变与质变的统一"},{"k":"B","t":"事物的发展是前进性与曲折性的统一"},{"k":"C","t":"量变必然引起质变，质变是量变的必然结果"},{"k":"D","t":"事物的发展总是从量变开始，量变是质变的必要准备"}],"answer":"BD","id":"第一章-492","index":492},{"chapter":"第一章","goal":"素质目标","type":"multi","no":35,"stem":"清近代小说家吴沃尧在其《历史小说总序》中写道：“从前所受皆为大略，一蹴而就於繁赜(zé，义为深奥、玄妙)，毋乃不可”。历史告诉我们，任何伟大的事业都不可能一帆风顺，不可能一蹴而就。实现中华民族伟大复兴的中国梦也要不断保持历史耐心，发扬钉钉子精神，一张蓝图绘到底，一茬接着一茬干，持之以恒、久久为功。材料体现的哲学道理是","options":[{"k":"A","t":"量变达到一定程度必然引起质变，质变是量变的必然结果"},{"k":"B","t":"事物发展是从量变到质变再到新量变的往复上升过程"},{"k":"C","t":"久久为功，发挥主观能动性就能取得改造世界的成功"},{"k":"D","t":"只有事物数量的不断增加，才能引起事物质的飞跃"}],"answer":"AB","id":"第一章-493","index":493},{"chapter":"第一章","goal":"素质目标","type":"multi","no":36,"stem":"“借用别人的智慧来做事，因为你的智慧是有限的。”这句话所强调的是( )","options":[{"k":"A","t":"做事要充分发挥主观能动性，利用各种有利条件"},{"k":"B","t":"做事要考虑事物的联系，割断那些不利的联系"},{"k":"C","t":"任何事物都是矛盾统一体，人不可能没有缺憾"},{"k":"D","t":"任何理性认识都是正确有用的，要借用别人的认识"}],"answer":"AC","id":"第一章-494","index":494},{"chapter":"第一章","goal":"素质目标","type":"multi","no":37,"stem":"《红岩》的作者，在一次次查阅有关档案、走访烈士的战友、搜集先烈们感人事迹的基础上，成功塑造了江姐等典型人物形象。这启示我们要( )","options":[{"k":"A","t":"坚持调查研究的工作方法"},{"k":"B","t":"正确发挥主观能动性"},{"k":"C","t":"坚持主观与客观相统一"},{"k":"D","t":"重视做好量的积累"}],"answer":"ABCD","id":"第一章-495","index":495},{"chapter":"第一章","goal":"素质目标","type":"multi","no":38,"stem":"新民主主义革命胜利前夕，毛泽东同志指出，“夺取全国胜利，这只是万里长征走完了第一步。如果这一步也值得骄傲,那是比较渺小的，更值得骄傲的还在后头”；在我们即将完成全面建成小康社会这一伟大历史任务之际，习近平总书记指出：“全面建成小康社会不是终点，而是新生活新奋斗的起点”。两代领导人的论述","options":[{"k":"A","t":"揭示了我国社会主义社会不同发展阶段的不同矛盾特点"},{"k":"B","t":"说明质变是根本性质的变化标志着事物发展过程的终结"},{"k":"C","t":"基于事物的发展是“量变一质变一新量变”的循环往复"},{"k":"D","t":"启示我们不满足已得成就、不断把我们的事业推向新高度"}],"answer":"CD","id":"第一章-496","index":496},{"chapter":"第一章","goal":"素质目标","type":"multi","no":39,"stem":"中国人民银行将在深圳、成都、苏州、雄安新区等地先行推进数字人民币试点，这标志着我国法定数字货币终于落地生根。对于数字货币发展前景，网友在网络上开展热烈讨论。下列哲学依据能支撑其主张的选项是","options":[{"k":"A","t":"前途光明——新出现的事物具有强大生命力"},{"k":"B","t":"道路曲折——人们接受新事物需要一个过程"},{"k":"C","t":"前途光明——新事物符合了社会发展的规律"},{"k":"D","t":"道路曲折——旧事物灭亡了才会产生新事物"}],"answer":"BC","id":"第一章-497","index":497},{"chapter":"第一章","goal":"素质目标","type":"multi","no":40,"stem":"飞行员在飞行过程中，有时看到的“灯光”是星光、看到的“海洋”是陆地，有时对高度、速度、方向的感知都不正确。这种空间迷向效应，是导致飞机失事的一种常见因素，克服空间迷向，飞行员的做法是“不相信感觉，要相信仪表”。下列对此理解正确的是","options":[{"k":"A","t":"“不相信感觉”是因为经验认识不可靠"},{"k":"B","t":"“要相信仪表”体现了意识活动的自觉选择性"},{"k":"C","t":"看到的“海洋”是陆地体现了意识活动的主动创造性"},{"k":"D","t":"看到的“灯光”是星光表明意识是客观存在的主观映象"}],"answer":"BD","id":"第一章-498","index":498},{"chapter":"第一章","goal":"素质目标","type":"multi","no":41,"stem":"火车刚出现的时候，跑不过马车。但是今天火车遍地跑，马车早已不见了踪迹。随着现代经济的发展，人们对速度和效率的要求日益提高，高速火车随之诞生，大大提升了交通便利。最近我国研制出了时速4000公里的高速火车，北京到上海只需要20分钟即到，这必将对我国经济发展产生巨大的推动作用。火车的出现与发展说明","options":[{"k":"A","t":"自然界是不断发展的，新事物必然代替旧事物"},{"k":"B","t":"社会实践需要推动了人为新事物的诞生与发展"},{"k":"C","t":"新事物具有强大的生命力和远大的发展前途"},{"k":"D","t":"只要符合社会需要的新事物都能够茁壮成长"}],"answer":"BC","id":"第一章-499","index":499},{"chapter":"第一章","goal":"素质目标","type":"multi","no":42,"stem":"我国承诺在2030年前，二氧化碳的排放不再增长，达到峰值之后再慢慢减下去，达成“碳达峰”目标；到2060年前，针对排放的二氧化碳，要釆取植树、节能减排等各种方式全部抵消掉，达成“碳中和”目标。做好碳达峰、碳中和工作应","options":[{"k":"A","t":"注重科学规划，以碳达峰碳中和目标工作方案作为改革出发点"},{"k":"B","t":"遵循生态规律，加快实施钢铁、建筑、石化行业的绿色化改造"},{"k":"C","t":"尊重经济发展与绿色发展关系的客观性，不改变自在事物联系"},{"k":"D","t":"推动量变向质变转化，通过碳减排、碳吸收实现碳中和的目标"}],"answer":"BD","id":"第一章-500","index":500},{"chapter":"第一章","goal":"素质目标","type":"multi","no":43,"stem":"75年前，世界人民经过浴血奋战，赢得世界反法西斯战争伟大胜利。风雨过后是彩虹，经历一次又一次考验，联合国仍然充满生机，寄托着70多亿人民对美好生活的向往，联合国宪章仍然是世界和平与发展的重要保障。联合国75年走过的历程说明","options":[{"k":"A","t":"质变是量变的必然结果，要抓机遇促成质变"},{"k":"B","t":"事物发展的道路是曲折的，但方向是前进的"},{"k":"C","t":"物质世界是绝对运动与相对静止的有机统一"},{"k":"D","t":"新事物得到人民的支持，就能顺利成长壮大"}],"answer":"BC","id":"第一章-501","index":501},{"chapter":"第一章","goal":"素质目标","type":"multi","no":44,"stem":"我们既要为全面建成小康社会跑好“最后一公里”，又要乘势而上开启全面建设社会主义现代化国家新征程。这是因为","options":[{"k":"A","t":"量变和质变是事物发展的两种基本状态"},{"k":"B","t":"重视量的积累就能实现事物的质变"},{"k":"C","t":"量变达到一定程度就要果断促成质变"},{"k":"D","t":"量变引起质变，质变又为新的量变开辟道路"}],"answer":"CD","id":"第一章-502","index":502},{"chapter":"第一章","goal":"素质目标","type":"multi","no":45,"stem":"目前，我国832个贫困县全部脱贫摘帽。但脱贫摘帽不是终点，而是新生活、新奋斗的起点。打赢脱贫攻坚战之后，帮扶政策要从攻坚战转入常态化，按照缺什么补什么的原则，更加注重分类施策、补短板强弱项。这一论断坚持了","options":[{"k":"A","t":"量变和质变的统一，在脱贫摘帽基础上开始新的量变"},{"k":"B","t":"前进性和曲折性的统一，对我们的发展前途充满信心"},{"k":"C","t":"肯定与否定的统一，脱贫摘帽的终点就是新的起点"},{"k":"D","t":"普遍性与特殊性的统一，分类施策解决短板和弱项"}],"answer":"AC","id":"第一章-503","index":503},{"chapter":"第一章","goal":"素质目标","type":"multi","no":46,"stem":"“你永远不能控制大自然，最好的办法是去了解大自然如何工作，然后让它为我们所用。”这句话所蕴含的哲理有（ ）","options":[{"k":"A","t":"一切从实际出发"},{"k":"B","t":"认识的目的在于改造世界"},{"k":"C","t":"发挥主观能动性与尊重客观规律是统一的"},{"k":"D","t":"实践主体能够创造物质"}],"answer":"ABC","id":"第一章-504","index":504},{"chapter":"第一章","goal":"素质目标","type":"multi","no":47,"stem":"现代西方哲学中有人主张“绝对否定”，认为任何肯定都是对辩证法的“背叛”，经过否定，一切对立面都将消灭，剩下的仅仅是“衰落和虚无”。这种观点的错误在于（ ）","options":[{"k":"A","t":"把否定看作全盘否定"},{"k":"B","t":"把否定和肯定绝对对立起来"},{"k":"C","t":"把否定的结果看作发展的消灭"},{"k":"D","t":"把否定看作联系的环节"}],"answer":"ABC","id":"第一章-505","index":505},{"chapter":"第一章","goal":"素质目标","type":"multi","no":48,"stem":"有人说“龙年生贵子”，从因果关系看，这个说法犯了如下错误（ ）","options":[{"k":"A","t":"倒因为果"},{"k":"B","t":"歪曲了原因和结果的关系"},{"k":"C","t":"倒果为因"},{"k":"D","t":"把没有因果关系的现象主观地联系在一起"}],"answer":"BD","id":"第一章-506","index":506},{"chapter":"第一章","goal":"素质目标","type":"multi","no":49,"stem":"20世纪科学技术的发展，使19世纪法国作家埃勒∙凡尔纳在其小说中描述很多的科学幻想成为现实，如电视机、直升飞机、潜水艇和人类登月等，很多发明家承认他们从凡尔纳的科学幻想中受到启发，甚至有人说：“现代科学只不过是将凡尔纳的语言付诸实践的过程而已”，作为人类意识花朵的科学幻想的付诸实现，表明( )","options":[{"k":"A","t":"意识不仅反映世界，而且能够通过实践改造世界"},{"k":"B","t":"意识怎样幻想世界，世界就会发生怎样的变化"},{"k":"C","t":"意识因其创造性，而具有直接现实性"},{"k":"D","t":"意识因其能动性，而可以成为实践的先导"}],"answer":"AD","id":"第一章-507","index":507},{"chapter":"第一章","goal":"素质目标","type":"multi","no":50,"stem":"据报道，美国加州大学研究人员设计出一种能控制光线运行方向的材料，这项重大突破使长期存在于科幻小说中的“隐形衣”梦想有可能变为现实。这启示我们( )","options":[{"k":"A","t":"意识不仅能反映现存事物，而目能正确预测未来"},{"k":"B","t":"利学创造往往需要利学幻想的激发和推动"},{"k":"C","t":"科学幻想向现实的转化离不开科学实验"},{"k":"D","t":"发挥意识活动的创造性就能将科学幻想变为现实"}],"answer":"BC","id":"第一章-508","index":508},{"chapter":"第一章","goal":"素质目标","type":"multi","no":51,"stem":"荒漠化治理是世界性难题。有专家根据部分地区的成功经验提出，对于人力治理效果不佳的地区，可以采用“人退”的方法，创造条件让自然界自我修复，实现“沙退”的目的。这种治理荒漠化的新思路体现的哲学道理是( )","options":[{"k":"A","t":"正确发挥主观能动性要以尊重和认识客观规律为前提"},{"k":"B","t":"适当放弃主观能动性的 ,"id":"第二章-115","index":115},{"chapter":"第二章","goal":"能力目标","type":"multi","no":10,"stem":"“批判的武器当然不能代替武器的批判，物质的力量只能用物质的力量来摧毁，理论一经群众掌握，也会变成物质力量。”这一论断的哲学思想是( )","options":[{"k":"A","t":"理论对实践具有指导作用"},{"k":"B","t":"理论不能代替实践"},{"k":"C","t":"理论本身就是物质力量"},{"k":"D","t":"理论必须被群众掌握才能变成改造社会的物质力量"}],"answer":"ABD","id":"第二章-116","index":116},{"chapter":"第二章","goal":"能力目标","type":"multi","no":11,"stem":"胡锦涛同志在重要会议上多次强调全社会要“学习，学习，再学习，实践，实践，再实践”。这一要求的哲学基础是（ ）","options":[{"k":"A","t":"学习第一，实践第二"},{"k":"B","t":"要理论联系实际"},{"k":"C","t":"既要学习书本知识，又要参加实践活动"},{"k":"D","t":"学习和实践都是认识的来源"}],"answer":"BC","id":"第二章-117","index":117},{"chapter":"第二章","goal":"能力目标","type":"multi","no":12,"stem":"同一棵大树，在木匠的眼中是木材，画家看到的是色彩和色调，植物学家看到的是它的形态特征，这是由于 ( )","options":[{"k":"A","t":"人的感觉受理性指导"},{"k":"B","t":"人的认识具有能动性"},{"k":"C","t":"理性认识是感性认识的基础"},{"k":"D","t":"已有的认识影响感觉活动"}],"answer":"AD","id":"第二章-118","index":118},{"chapter":"第二章","goal":"能力目标","type":"multi","no":13,"stem":"有一个珠宝商一生致力于珠宝的真伪之辨，技艺炉火纯青。一天，他看到一个孩子将真假珠宝混在一起当作玩具玩耍而自得其乐。对此，珠宝商感叹不已。这个寓言表达的哲学道理是（ ）","options":[{"k":"A","t":"在生活中人们辨别真伪是没有意义的"},{"k":"B","t":"游戏并快乐才是人们生活的真实意义"},{"k":"C","t":"人们对同一事物有着不同的价值观念"},{"k":"D","t":"不同价值观念决定了不同的人生态度"}],"answer":"CD","id":"第二章-119","index":119},{"chapter":"第二章","goal":"能力目标","type":"multi","no":14,"stem":"“蚂蚁具有和我们不同的眼睛，它们能看见我们看不见的光线。但是，在认识我们所看不见的这些光线方面，我们的成就比蚂蚁大得多。我们能够证明蚂蚁看得见我们所看不见的东西，而且这种证明只是以我们的眼睛所造成的知觉为基础，这就说明人的眼睛特殊构造并不是人的认识的绝对界限。”恩格斯这个论断的根据是( )","options":[{"k":"A","t":"实践促进人的感觉能力的进化与发展"},{"k":"B","t":"实践促进感知事物的技术手段的发展"},{"k":"C","t":"实践促进对感知信息进行综合分析能力的提高"},{"k":"D","t":"实践促进人类直觉事物本质能力的提高"}],"answer":"BC","id":"第二章-120","index":120},{"chapter":"第二章","goal":"能力目标","type":"multi","no":15,"stem":"1971年迪斯尼乐园的路径设计获得了“世界最佳设计”奖，设计师格罗培斯格却说：“其实那不是我的设计”，原因是在迪斯尼乐园主题工程完工后，格罗培斯格暂停修乐园里的道路，并在空地上洒上草种，五个月后，乐园里绿草茵茵，草地上被游客走出了不少宽窄不一的小路，格罗培斯格根据这些行人踏出来的小路铺设了路径，被称为“优雅自然、简洁便利、个性突出”的优秀设计。格罗培斯格设计智慧启示我们认识和实践活动中（ ）","options":[{"k":"A","t":"要从生活实践中获取灵感"},{"k":"B","t":"要尊重群众的实践需求"},{"k":"C","t":"不要对自然事物作任何改变"},{"k":"D","t":"要对事物本来面目做直观反应"}],"answer":"AB","id":"第二章-121","index":121},{"chapter":"第二章","goal":"能力目标","type":"multi","no":16,"stem":"头孢曲松钠是一种常见的抗生素，临床应用十分广泛。但是，如果把它和某些药物一起服用，就会导致药效减弱、副作用增强，对人体造成损害。这种现象在医学上称为配伍禁忌。在没有发现这个问题的时候，曾出现病人服用该药物致死的案例。卫生主管部门在调查研究的基础上，并没有禁止使用这种药物，而是要求在药品使用说明书中写明配伍禁忌的有关情况。对一种药物及其配伍禁忌的认识，体现出认识( )","options":[{"k":"A","t":"是一个永远不能达到真理的过程"},{"k":"B","t":"是一个追求终极真理的过程"},{"k":"C","t":"是一个永无止境的无限发展过程"},{"k":"D","t":"是一个包含矛盾的辩证发展过程"}],"answer":"CD","id":"第二章-122","index":122},{"chapter":"第二章","goal":"能力目标","type":"multi","no":17,"stem":"最近，我国有科学家采用铝铍埋藏测年法的技术手段测定，北京猿人生活在约七十七万年前，此前，根据其他测年法，学术界采信“四五十万年前”的说法，上述考古研究情况表明( )","options":[{"k":"A","t":"任何具体实践对认识真理性的检验都具有局限性"},{"k":"B","t":"专家公认的检验手段和考古结论具有更高的可靠性"},{"k":"C","t":"不同的考古实践手段必然得出不同的考古结论"},{"k":"D","t":"不同考古结论应不断接受新的考古实践的再检验"}],"answer":"AD","id":"第二章-123","index":123},{"chapter":"第二章","goal":"能力目标","type":"multi","no":18,"stem":"2009年3月28日20时30分到21时30分，全球24个时区的2000余座城镇以熄灯一小时的方式“接力”参加了世界自然基金会发起的旨在节能减排保护人类地球家园的“地球一小时”活动，我国从东到西众多城市的公众积极参与了这一活动，“地球一小时”活动节约的能源虽然有限，但是当环保意识深入人性并化为自觉保护环境的实践，就会对全球节能减排事业做出巨大的贡献。这说明( )","options":[{"k":"A","t":"实践是主观见于客观的能动的物质性活动"},{"k":"B","t":"实践是按照主观的内在本性改造世界的活动"},{"k":"C","t":"实践具有能动性，社会性和客观性的突出特点"},{"k":"D","t":"实践是人类应对环境的有效合理的适应性活动"}],"answer":"AC","id":"第二章-124","index":124},{"chapter":"第二章","goal":"能力目标","type":"multi","no":19,"stem":"2008年1月中下旬，我国南方10多个省区持续降雪，出现低温冰冻的极端天气现象，造成严重灾害，给人民生活、生产带来极大困难和损失。有专家指出，极端天气如果发生在远古或者发生在人烟稀少的地区，就不会构成如此严重的灾难。之所以造成如此严重灾害，和时值“春运”、发生在人口稠密、经济发展较快地区以及防灾准备不足等因素共同起作用有密切关系。鉴于此，我国政府提出，越是经济发展越要高度重视防范灾害的工作。随着人类社会的发展，极端天气对人类生活的影响越来越大。这表明( )","options":[{"k":"A","t":"人类认识和改造自然的实践不断发展使人与自然的矛盾也随之深化和发展"},{"k":"B","t":"人类认识和改造自然的实践不断发展使人与自然的矛盾越来越激化和失控"},{"k":"C","t":"人类社会的发展使人类与自然界的联系越来越多样化和复杂化"},{"k":"D","t":"人类社会的发展越来越使人类超越自然而逐渐成为自然界的主宰"}],"answer":"AC","id":"第二章-125","index":125},{"chapter":"第二章","goal":"能力目标","type":"multi","no":20,"stem":"长期以来，农业生产中施肥浇水凭经验和感觉。某教授对传统经验进行系统分析，去伪存真、总结概括，研究、开发出“基于模型的精确作物管理技术”，指导农民定时定量科学种田，取得了少施氮肥、增产增收的显著成效。“基于模型的精确作物管理技术”实现了传统农业生产经验的升华，说明( )","options":[{"k":"A","t":"模糊性的传统经验存在一定的局限性"},{"k":"B","t":"认识的升华必须扬弃传统经验的模糊性"},{"k":"C","t":"模糊性的传统经验是精确性认识的来源"},{"k":"D","t":"精确性的认识必须全面继承传统经验"}],"answer":"AB","id":"第二章-126","index":126},{"chapter":"第二章","goal":"能力目标","type":"multi","no":21,"stem":"随着科学技术的发展，目前72小时的气象预报可以和25年前36小时的气象预报一样可靠。但由于受天气状况原始数据、计算手段、分析能力等条件的限制，气象预报难以避免误差。在这个意义上，气象预报仍然是一门不精确的科学。随着气象预报科学技术的发展，人们能够作出更精确和更长期的气象预报，其哲学依据是( )","options":[{"k":"A","t":"大气运动尽管复杂，但有规律并可以被认识"},{"k":"B","t":"大气运动的偶然性逐渐向有规律的必然性转化"},{"k":"C","t":"科学技术的发展使人们认识这些规律的能力不断提高"},{"k":"D","t":"科学技术的发展已使人们完全掌握大气运动的规律"}],"answer":"AC","id":"第二章-127","index":127},{"chapter":"第二章","goal":"能力目标","type":"multi","no":22,"stem":"“气象预报仍然是一门不精确的科学”，此论断给我们的启示是，自然现象的无限复杂性决定了( )","options":[{"k":"A","t":"人的认识永远不能达到真理"},{"k":"B","t":"人的真理性认识包含谬误的成分"},{"k":"C","t":"人的真理性认识具有相对性"},{"k":"D","t":"人的认识有待于进一步发展"}],"answer":"CD","id":"第二章-128","index":128},{"chapter":"第二章","goal":"能力目标","type":"multi","no":23,"stem":"维生素是维持人体正常功能的基本要素。以往人们通过食物获取这些微量物质，科学的发展使人们能够通过服用某种和某几种维生素来弥补食物摄取方式的不足。一些科学家认为，大量服用某些维生素有益于身体健康，但另一些科学家警告说，服用过量的维生素可能对健康造成损害。关于维生素问题的争论表明( )","options":[{"k":"A","t":"人们获得的正确认识总是有条件的和不完善的"},{"k":"B","t":"人们获得的正确认识仅在一定时期内是真理"},{"k":"C","t":"人们获得的正确认识不具有终极真理的性质"},{"k":"D","t":"人们的认识不能正确把握事物的本质和规律"}],"answer":"AC","id":"第二章-129","index":129},{"chapter":"第二章","goal":"能力目标","type":"multi","no":24,"stem":"2016年9月25日，有着“超级天眼”之称的全球最大500米口径球面射电望远镜FAST在贵州平塘县正式启用。与世界上最先进的望远镜相比，其综合观测能力提高了约10倍，将在未来10年到20年保持世界领先地位。据介绍，光学望远镜和射电望远镜都是观测宇宙天体的重要工具，但不同于其他的望远镜，射电望远镜接收的是肉眼看不到的射电波。因此，FAST的工作不是“看”，而是“听”，依靠500米口径的“大耳朵”来“收听”太空深处物体发出的无线电波。以上材料说明（ ）","options":[{"k":"A","t":"连接主体和客体之间的实践工具可以帮助人们突破感官的自然极限"},{"k":"B","t":"实践为认识的发展提供了手段和条件"},{"k":"C","t":"科学技术是认识发展的源泉和根本动力"},{"k":"D","t":"世界上的联系都体现着“人化”的特点"}],"answer":"AB","id":"第二章-130","index":130},{"chapter":"第二章","goal":"能力目标","type":"multi","no":25,"stem":"在新冠疫情防控中，人工智能及5G技术广泛应用于远程会诊、疫苗检测、社区排查、体温监测等领域，为疫情态势研判、疫情防控部署提供了强有力的支撑。由此可见，人工智能（ ）","options":[{"k":"A","t":"具有主动创造性，能够检验自身认识是否符合实践需要"},{"k":"B","t":"模拟人类思维，能够根据指令有效处理信息和得出结论"},{"k":"C","t":"延伸了人类认识器官，能够促进人类认识和实践的发展"},{"k":"D","t":"源于人类智慧，能够揭示深藏于事物内部的本质和规律"}],"answer":"BC","id":"第二章-131","index":131},{"chapter":"第二章","goal":"能力目标","type":"multi","no":26,"stem":"“空想性视错觉”是指人常常会把一些模糊的、随机的图像感知为一些有意义的图像，如看到天上的白云，你会不自觉地将其想象成各种各样的东西；看到树洞，会想象成鬼怪的嘴。该现象说明（ ）","options":[{"k":"A","t":"人的思维活动具有主动创造性"},{"k":"B","t":"主体对客体的反映是能动的反映"},{"k":"C","t":"事物的复杂性是导致错觉产生的重要原因"},{"k":"D","t":"人的意识可以赋予事物一些本来没有的属性"}],"answer":"AB","id":"第二章-132","index":132},{"chapter":"第二章","goal":"能力目标","type":"multi","no":27,"stem":"嫦娥四号探月工程团队获“影响世界华人大奖”。嫦娥四号首次在月球背面留下了人类探月的第一行足迹， 开启了探索宇宙奥秘的新篇章。中国探月工程将继续进行，嫦娥五号、六号、七号、八号还将实现区域软着陆及采样返回、月球南极采样返回和月球极区探测等，后续还将论证建立月球科研基地。这进一步佐证了（ ）","options":[{"k":"A","t":"意识活动具有主动创造性和直接现实性"},{"k":"B","t":"世界是可知的，思维和存在具有同一性"},{"k":"C","t":"实践是认识的目的和发展的动力"},{"k":"D","t":"科学实验是检验认识的真理性的唯一标准"}],"answer":"BC","id":"第二章-133","index":133},{"chapter":"第二章","goal":"能力目标","type":"multi","no":28,"stem":"2019年是中华人民共和国建国70周年，七十年的风雨兼程，七十年的努力奋进，七十年的不断创新，使中国发生了翻天覆地的变化。中国，实现了从站起来、富起来、强起来的历史性飞跃。70年翻天覆地的变化表明（ ）","options":[{"k":"A","t":"运动是物质的运动"},{"k":"B","t":"物质是运动的物质"},{"k":"C","t":"运动是物质固有的根本属性和存在方式"},{"k":"D","t":"运动是物质的唯一特性"}],"answer":"BC","id":"第二章-134","index":134},{"chapter":"第二章","goal":"能力目标","type":"multi","no":29,"stem":"近年来，人们常抱怨“现在的西红柿没有以前的味道”。为了解决这一难题，中美联合科研团队历时四年多，对一百多种番茄进行了多次严格的品尝实验和基因组测序分析，发现控制风味品质的部分基因位点丢失是导致番茄口味下降的重要原因。这一发现为番茄风味改良奠定了重要理论基础。这说明（ ）","options":[{"k":"A","t":"科学实验是人们能够正确认识番茄口感下降问题的基础"},{"k":"B","t":"发现番茄风味品质是变革社会实践的最终目的"},{"k":"C","t":"番茄风味的复杂性决定了认识其的过程具有反复性"},{"k":"D","t":"科学家们的主观能动性是能否成功改良番茄风味的前提"}],"answer":"AC","id":"第二章-135","index":135},{"chapter":"第二章","goal":"能力目标","type":"multi","no":30,"stem":"2020年是恩格斯诞辰200周年。作为马克思主义的创始人之一，恩格斯在谈到马克思主义产生时说：“同任何新的学说样，它必须首先从已有的思想材料出发，虽然它的根子深深扎在经济的事实中。”上述论断蕴含的哲学道理是（ ）","options":[{"k":"A","t":"理论发展具有相对独立性"},{"k":"B","t":"理论只能反映当前经济事实"},{"k":"C","t":"理论总是受到客观现实的制约"},{"k":"D","t":"来源于现实的理论就具有真理性"}],"answer":"AC","id":"第二章-136","index":136},{"chapter":"第二章","goal":"能力目标","type":"multi","no":31,"stem":"1896年，门捷列夫公布自己制作的元素周期表，将已经发现的化学元素纳入一个统一的体系中，依照元素周期律，门捷列夫推断当时的一些原子量测定结果存在误差， 预言“类铝”（镓）、“类硼”（钪）等当时尚未发现元素的存在，他的推断和预言后来在实验中被逐一证实，这表明（ ）","options":[{"k":"A","t":"科学发现来源于认识的不断深化与积累"},{"k":"B","t":"科学原理对探索和发现客观真理具有指导作用"},{"k":"C","t":"任何科学理论都必须在实践中验证自己的真理性"},{"k":"D","t":"科学原理-科学预测-实践检验是认识发展的一般规律"}],"answer":"BC","id":"第二章-137","index":137},{"chapter":"第二章","goal":"能力目标","type":"judge","no":1,"stem":"“全部社会生活在本质上是实践的。”","options":[],"answer":"是","id":"第二章-138","index":138},{"chapter":"第二章","goal":"能力目标","type":"judge","no":2,"stem":"人类的实践活动与动物本能的适应性活动相同。","options":[],"answer":"否","id":"第二章-139","index":139},{"chapter":"第二章","goal":"能力目标","type":"judge","no":3,"stem":"辩证唯物主义和旧唯物主义都坚持反映论，但二者有着本质区别。","options":[],"answer":"是","id":"第二章-140","index":140},{"chapter":"第二章","goal":"能力目标","type":"judge","no":4,"stem":"真理的形式是通过人的思维表现出来的，因而真理的形式是主观的。","options":[],"answer":"是","id":"第二章-141","index":141},{"chapter":"第二章","goal":"能力目标","type":"judge","no":5,"stem":"旧唯物主义认识论的严重缺陷在于不承认世界的可知性。","options":[],"answer":"否","id":"第二章-142","index":142},{"chapter":"第二章","goal":"能力目标","type":"judge","no":6,"stem":"在认识真理的思想内容客观性的同时，还必须正确认识真理形式的主观性。","options":[],"answer":"是","id":"第二章-143","index":143},{"chapter":"第二章","goal":"能力目标","type":"judge","no":7,"stem":"价值评价是“公说公有理，婆说婆有理”，纯粹是一种没有任何客观标准的评价。","options":[],"answer":"否","id":"第二章-144","index":144},{"chapter":"第二章","goal":"能力目标","type":"judge","no":8,"stem":"“人的思维是否具有真理性，这并不是一个理论的问题，而是一个实践的问题。人应该在实践中证明自己思维的真理性，即自己思维的现实性和力量，亦即自己思维的此岸性。”这一论断说明了实践是检验认识是否具有真理性的唯一标准。","options":[],"answer":"是","id":"第二章-145","index":145},{"chapter":"第二章","goal":"能力目标","type":"judge","no":9,"stem":"毛泽东说：“马克思主义哲学认为十分重要的问题，不在于懂得了客观世界的规律性，因而能够解释世界，而在于拿了这种对于客观规律性的认识去能动地改造世界。”这段话强调的是认识的任务不仅在于解释世界，更重要的是改造世界。","options":[],"answer":"是","id":"第二章-146","index":146},{"chapter":"第二章","goal":"能力目标","type":"judge","no":10,"stem":"从实际出发，关键是要注重事实。","options":[],"answer":"是","id":"第二章-147","index":147},{"chapter":"第二章","goal":"能力目标","type":"j const ALL = DATA.questions;
const TYPE_NAME = { single: '单项选择', multi: '多项选择', judge: '判断' };
const el = (id) => document.getElementById(id);
const AUTO_MS = 1400;

let queue = [], idx = 0, right = 0, wrong = 0, wrongList = [], responses = [];
let answered = false, auto = true, timer = null, chapter = 'all', type = 'all', order = 'seq';

function pool(){
  return ALL.filter(function(q){
    if (chapter !== 'all' && q.chapter !== chapter) return false;
    if (type !== 'all' && q.type !== type) return false;
    return true;
  });
}
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function setChips(container, attr, value){
  container.querySelectorAll('.chip').forEach(function(b){
    b.setAttribute('aria-pressed', String(b.dataset[attr] === value));
  });
}
function build(items){
  queue = order === 'rand' ? shuffle(items.slice()) : items.slice();
  idx = 0; right = 0; wrong = 0; wrongList = []; responses = new Array(queue.length).fill(null);
  el('start').classList.add('hidden');
  el('result').classList.add('hidden');
  el('quiz').classList.remove('hidden');
  if (!queue.length){ finish(); return; }
  render();
}
function render(){
  clearTimeout(timer);
  const q = queue[idx];
  if (!q){ finish(); return; }
  const resp = responses[idx];
  answered = !!resp;
  el('qtag').textContent = q.chapter + ' · ' + TYPE_NAME[q.type];
  el('qno').textContent = '第 ' + (idx + 1) + ' / ' + queue.length + ' 题';
  el('stats').textContent = '正确 ' + right + ' · 错误 ' + wrong;
  el('stem').textContent = q.stem;
  const fb = el('fb'); fb.className = 'fb';
  el('fbBadge').textContent = ''; el('fbText').textContent = '';
  el('autoHint').textContent = '';
  el('prevBtn').disabled = (idx === 0);
  el('nextBtn').textContent = (q.type === 'multi' && !resp) ? '提交答案'
    : (idx === queue.length - 1 ? '查看结果' : '下一题');

  const box = el('opts'); box.innerHTML = '';
  if (q.type === 'judge'){
    [['是', '是（正确）'], ['否', '否（错误）']].forEach(function(pair){
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'opt'; b.dataset.k = pair[0];
      const k = document.createElement('span'); k.className = 'k'; k.textContent = pair[0];
      const t = document.createElement('span'); t.className = 't'; t.textContent = pair[1];
      b.appendChild(k); b.appendChild(t);
      b.addEventListener('click', function(){ answer(pair[0]); });
      box.appendChild(b);
    });
  } else {
    q.options.forEach(function(o){
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'opt'; b.dataset.k = o.k;
      const k = document.createElement('span'); k.className = 'k'; k.textContent = o.k;
      const t = document.createElement('span'); t.className = 't'; t.textContent = o.t;
      b.appendChild(k); b.appendChild(t);
      if (q.type === 'multi'){
        b.addEventListener('click', function(){
          if (answered) return;
          b.classList.toggle('sel');
          b.setAttribute('aria-pressed', b.classList.contains('sel') ? 'true' : 'false');
        });
      } else {
        b.addEventListener('click', function(){ answer(o.k); });
      }
      box.appendChild(b);
    });
  }
  if (resp) paint(q, resp);
  updateBar();
}
function paint(q, resp){
  const opts = document.querySelectorAll('.opt');
  opts.forEach(function(b){
    b.disabled = true;
    const k = b.dataset.k;
    const correct = q.answer.indexOf(k) >= 0;
    const picked = resp.picked.indexOf(k) >= 0;
    b.classList.remove('sel');
    if (correct) b.classList.add('ok');
    if (picked && !correct) b.classList.add('bad');
    if (!correct && !picked) b.classList.add('dim');
  });
  const fb = el('fb');
  fb.className = 'fb show ' + (resp.ok ? 'good' : 'bad');
  el('fbBadge').textContent = resp.ok ? '正确' : '回答错误';
  el('fbText').textContent = resp.ok
    ? ('回答正确，答案 ' + q.answer.split('').join('、'))
    : ('正确答案是 ' + answerText(q));
  el('stats').textContent = '正确 ' + right + ' · 错误 ' + wrong;
}
function answerText(q){
  if (q.type === 'judge') return q.answer === '是' ? '是（正确）' : '否（错误）';
  const map = {};
  q.options.forEach(function(o){ map[o.k] = o.t; });
  return q.answer.split('').map(function(k){ return k + '．' + (map[k] || ''); }).join('　');
}
function updateBar(){
  const done = idx + (answered ? 1 : 0);
  const pct = queue.length ? Math.round(done / queue.length * 100) : 0;
  el('bar').firstElementChild.style.width = pct + '%';
  el('bar').setAttribute('aria-valuenow', String(pct));
}
function submit(picked){
  if (answered || !queue[idx]) return;
  const q = queue[idx];
  const ok = q.type === 'multi'
    ? picked.split('').sort().join('') === q.answer.split('').sort().join('')
    : picked === q.answer;
  answered = true;
  responses[idx] = { picked: picked, ok: ok };
  if (ok){ right++; } else { wrong++; wrongList.push(q); }
  paint(q, responses[idx]);
  el('nextBtn').textContent = idx === queue.length - 1 ? '查看结果' : '下一题';
  updateBar();
  if (auto){
    el('autoHint').textContent = '即将自动进入下一题…';
    timer = setTimeout(next, AUTO_MS);
  }
}
function answer(k){ submit(k); }
function submitMulti(){
  const q = queue[idx];
  if (!q || q.type !== 'multi' || answered) return;
  const picked = Array.from(document.querySelectorAll('.opt.sel')).map(function(b){ return b.dataset.k; }).join('');
  if (!picked){ el('autoHint').textContent = '请先选择答案再提交'; return; }
  submit(picked.split('').sort().join(''));
}
function next(){
  clearTimeout(timer);
  if (idx >= queue.length - 1){ finish(); return; }
  idx++; render();
}
function prev(){
  clearTimeout(timer);
  if (idx > 0){ idx--; render(); }
}
function finish(){
  clearTimeout(timer);
  el('quiz').classList.add('hidden');
  el('result').classList.remove('hidden');
  const total = queue.length;
  const acc = total ? Math.round(right / total * 100) : 0;
  const skipped = responses.filter(function(r){ return !r; }).length;
  el('scoreText').textContent = right + ' / ' + total;
  el('scoreSub').textContent = '正确率 ' + acc + '%　答错 ' + wrong + ' 题'
    + (skipped ? ('　未作答 ' + skipped + ' 题') : '');
  const box = el('wrongs'); box.innerHTML = '';
  if (!wrongList.length){
    box.innerHTML = '<div class="hint">没有错题，全部答对。</div>';
  } else {
    wrongList.forEach(function(q){
      const d = document.createElement('div'); d.className = 'wrong';
      const qd = document.createElement('div'); qd.className = 'q';
      qd.textContent = q.chapter + ' · ' + TYPE_NAME[q.type] + '　' + q.stem;
      const ad = document.createElement('div'); ad.className = 'a';
      ad.textContent = '正确答案：' + answerText(q);
      d.appendChild(qd); d.appendChild(ad);
      box.appendChild(d);
    });
  }
  el('counter').textContent = '';
  el('bar').firstElementChild.style.width = '100%';
}

  auto = !auto;

  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;

  if (e.key >= '1' && e.key <= '4' && !answered){

      if (e.key === '2') answer('否');
    } else {
      const k = 'ABCD'[Number(e.key) - 1];
      const btn = document.querySelector('.opt[data-k="' + k + '"]');
      if (btn){ if (q.type === 'multi') btn.click(); else answer(k); }
    }
  } else if (e.key === 'Enter' && q.type === 'multi' && !answered){
    submitMulti();
  } else if (e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    if (answered) next();
  } else if (e.key === 'ArrowLeft'){ e.preventDefault(); prev(); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); next(); }
});
</script>
</body>
</html>
